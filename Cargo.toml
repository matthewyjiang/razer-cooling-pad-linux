[package]
name = "razer-coolingpad-linux"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "razer-coolingpad-fancurve"
path = "src/bin/razer-coolingpad-fancurve.rs"

[[bin]]
name = "razer-coolingpad-preset"
path = "src/bin/razer-coolingpad-preset.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
hidapi = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
