name: publish-arch-package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # Build-only on PRs touching packaging, so PKGBUILD breakage shows up before a tag.
  pull_request:
    paths:
      - "PKGBUILD"
      - "gui/**"
      - ".github/workflows/publish-arch-package.yml"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build tools
        run: |
          pacman -Sy --noconfirm base-devel git pacman-contrib sudo
          useradd --create-home --shell /bin/bash builduser
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builduser

      - name: Checkout package repo
        uses: actions/checkout@v4

      - name: Build package
        run: |
          chown -R builduser:builduser "$GITHUB_WORKSPACE"
          sudo -u builduser makepkg -s --noconfirm
          # The GUI depends on the CLI package, so install it before resolving the GUI's deps.
          pacman -U --noconfirm ./*.pkg.tar.zst
          (cd gui/arch && sudo -u builduser makepkg -s --noconfirm)

      - name: Checkout mjiang-extras
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: matthewyjiang/mjiang-extras
          token: ${{ secrets.MJIANG_EXTRAS_PUSH_TOKEN }}
          path: mjiang-extras

      - name: Publish package files
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          chmod +x mjiang-extras/scripts/publish-packages.sh
          mjiang-extras/scripts/publish-packages.sh --repo-dir mjiang-extras ./*.pkg.tar.zst gui/arch/*.pkg.tar.zst

          cd mjiang-extras
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add x86_64/
          git commit -m "Update packages from ${{ github.repository }}" || exit 0
          git push
