[package]
name = "razer-coolingpad-gui"
# Not versioned here: the packages carry the release version, and bumping this would
# also need a Cargo.lock bump for `--locked` builds.
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"
description = "Desktop GUI for the Razer Laptop Cooling Pad fan curve controller"

[dependencies]
# Rune is pre-release: pin a `dev` rev and keep every patch below on the same rev.
# Default features pull in hunspell (needs a C++ compiler), audio and SVG, none of which we use.
rune = { git = "https://github.com/anomalyco/rune", rev = "048528dc35f0a7499887f334330fd9704cdd8e51", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "wayland-csd-title"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "048528dc35f0a7499887f334330fd9704cdd8e51", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cargo doesn't inherit patches from a dependency; this list mirrors Rune's root Cargo.toml at `rev`.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "048528dc35f0a7499887f334330fd9704cdd8e51" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "048528dc35f0a7499887f334330fd9704cdd8e51" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "048528dc35f0a7499887f334330fd9704cdd8e51" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "048528dc35f0a7499887f334330fd9704cdd8e51" }
naga = { git = "https://github.com/anomalyco/rune", rev = "048528dc35f0a7499887f334330fd9704cdd8e51" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "048528dc35f0a7499887f334330fd9704cdd8e51" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "048528dc35f0a7499887f334330fd9704cdd8e51" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "048528dc35f0a7499887f334330fd9704cdd8e51" }

[profile.release]
lto = "thin"
strip = true
